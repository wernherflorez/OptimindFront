services:
  - type: web
    name: optimind-api
    runtime: node
    region: oregon
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true       # Render genera un valor aleatorio seguro
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: DATABASE_URL
        sync: false               # Pega aquí la connection string de Supabase (Settings → Database)
      - key: CORS_ORIGINS
        value: https://TU_SITIO.netlify.app  # ← Cambia por tu URL de Netlify

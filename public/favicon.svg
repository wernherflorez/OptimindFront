<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0d2137"/>
      <stop offset="55%"  stop-color="#0a7a80"/>
      <stop offset="100%" stop-color="#0e9da3"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2dd4bf"/>
      <stop offset="50%"  stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondo redondeado gradiente -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Anillo gradiente exterior -->
  <rect x="1" y="1" width="30" height="30" rx="7"
        fill="none" stroke="url(#ring)" stroke-width="1.8" opacity="0.8"/>

  <!-- Segunda línea interna sutil -->
  <rect x="2.5" y="2.5" width="27" height="27" rx="5.5"
        fill="none" stroke="#14b8a6" stroke-width="0.5" opacity="0.25"/>

  <!-- Brillo superior interno -->
  <rect x="1" y="1" width="30" height="14" rx="7" fill="url(#shine)"/>

  <!-- Texto OM con filtro de glow -->
  <text x="16" y="22" font-family="Arial,sans-serif" font-size="13.5"
        font-weight="900" fill="white" text-anchor="middle"
        letter-spacing="-0.5" filter="url(#glow)">OM</text>

  <!-- Punto de acento teal bajo el texto -->
  <circle cx="16" cy="27" r="1.5" fill="#2dd4bf" opacity="0.7"/>
</svg>
